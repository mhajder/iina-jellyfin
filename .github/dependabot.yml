version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    schedule:
      interval: 'daily'
    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: 'npm'
    directory: '/'
    commit-message:
      prefix: 'build'
      prefix-development: 'chore'
      include: 'scope'
    schedule:
      interval: 'daily'
    groups:
      npm-dependencies:
        dependency-type: 'production'
      npm-dev-dependencies:
        dependency-type: 'development'
  - package-ecosystem: 'pre-commit'
    directory: '/'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    schedule:
      interval: 'daily'
    groups:
      pre-commit:
        patterns:
          - '*'
